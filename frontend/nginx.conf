# Блок 1: Перенаправление с HTTP на HTTPS
server {
    listen 80;
    server_name o6oyudno.tech;

    # Оставляем для будущего продления сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Блок 2: ОСНОВНОЙ СЕРВЕР (HTTPS)
server {
    listen 443 ssl;
    server_name o6oyudno.tech;

    # Пути к сертификатам (внутри контейнера)
    ssl_certificate /etc/letsencrypt/live/o6oyudno.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/o6oyudno.tech/privkey.pem;

    # Настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Прокси для API
    location /api/ {
        proxy_pass http://backend:5021/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фронтенд (React/Vue/Static)
    location / {
        try_files $uri /index.html;
    }
}